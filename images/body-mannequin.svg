        <ellipse cx="237" cy="151"
                 rx="12" ry="4"/>

        <ellipse cx="109" cy="199"
                 rx="10" ry="4"/>

        <ellipse cx="251" cy="199"
                 rx="10" ry="4"/>

        <!-- WRISTS -->

        <ellipse cx="102" cy="235"
                 rx="9" ry="3"/>

        <ellipse cx="258" cy="235"
                 rx="9" ry="3"/>

        <!-- THIGHS -->

        <ellipse cx="153" cy="268"
                 rx="17" ry="5"/>

        <ellipse cx="207" cy="268"
                 rx="17" ry="5"/>

        <!-- INSEAM -->

        <path id="inseam-line"
