    <!-- ORIENTATION -->

    <g fill="#789d85"
       font-family="monospace"
       font-size="11">

        <text x="75"
              y="30"
              text-anchor="middle">R</text>

        <text x="285"
              y="30"
              text-anchor="middle">L</text>

    </g>

    <!-- FOOTER -->

    <g font-family="monospace"
       text-anchor="middle">

        <text x="180"
              y="475"
              font-size="10"
              letter-spacing="2"
              fill="#8fce9c">
            ANATOMICAL MAPPING
        </text>

        <text x="180"
              y="489"
              font-size="7"
              fill="#789d85">
            THE DEN // REFERENCE MODEL
        </text>

    </g>

</svg>
