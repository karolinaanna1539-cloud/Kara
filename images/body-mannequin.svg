        <!-- KNEES -->

        <ellipse cx="157" cy="326"
                 rx="12" ry="4"/>

        <ellipse cx="203" cy="326"
                 rx="12" ry="4"/>

        <!-- CALVES -->

        <ellipse cx="157" cy="365"
                 rx="13" ry="4"/>

        <ellipse cx="203" cy="365"
                 rx="13" ry="4"/>

        <!-- ANKLES -->

        <ellipse cx="158" cy="411"
                 rx="10" ry="3"/>

        <ellipse cx="202" cy="411"
                 rx="10" ry="3"/>

