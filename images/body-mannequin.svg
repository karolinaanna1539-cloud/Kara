                 M182 142Q202 153 217 138"/>

        <!-- TORSO -->

        <path d="M180 171V208
                 M177 217H183"/>

        <!-- KNEES -->

        <path d="M148 326Q158 332 169 326
                 M191 326Q201 332 212 326"/>

    </g>

    <!-- MEASUREMENT GUIDELINES -->

    <g id="measurement-guidelines"
       stroke="#8fce9c"
       stroke-width="1"
       stroke-dasharray="4 3"
       fill="none"
       opacity=".8">

        <!-- HEIGHT -->

        <path id="height-line"
